[package]
name = "pydustmasker"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Python bindings algorithmss for identifying and masking low-complexity regions in nucleotide and protein sequences"
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "_pydustmasker"

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module"] }
thiserror = "2.0.12"
