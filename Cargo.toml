[package]
name = "pydustmasker"
version = "3.2.0"
edition = "2021"
rust-version = "1.89"
description = "Python bindings algorithms for identifying and masking low-complexity regions in nucleotide and protein sequences"
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "_pydustmasker"

[dependencies]
fearless_simd = "0.6.0"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
thiserror = "2.0.19"
