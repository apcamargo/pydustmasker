name: Pyodide

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: "Upload the tested wheel as the wheels-pyodide artifact"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # PYTHON_VERSION must match the Python of the PYODIDE_VERSION xbuildenv
  PYODIDE_VERSION: "314.0.7"
  PYTHON_VERSION: "3.14"

jobs:
  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "maturin>=1.14,<2.0" "pyodide-build>=0.39"
      - name: Install Emscripten and Rust toolchain
        run: |
          pyodide xbuildenv install "${PYODIDE_VERSION}"
          pyodide xbuildenv install-emscripten
          pyodide config get emscripten_dir >> "$GITHUB_PATH"
          toolchain=$(pyodide config get rust_toolchain)
          rustup toolchain install "${toolchain}" --profile minimal --target wasm32-unknown-emscripten
          echo "RUSTUP_TOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"
      - name: Cache dependencies
        # Release builds don't restore caches written by other workflow runs
        if: ${{ !inputs.upload-artifact }}
        uses: Swatinem/rust-cache@v2
      - name: Build wheel
        env:
          # Warnings fail CI builds but not release builds
          DENY_WARNINGS: ${{ !inputs.upload-artifact && '-D warnings' || '' }}
        run: |
          rustflags=$(pyodide config get rustflags)
          platform_version=$(pyodide config get pyemscripten_platform_version)
          export RUSTFLAGS="${rustflags} -C target-feature=+simd128 ${DENY_WARNINGS}"
          export MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION="${platform_version}"
          maturin build --release --target wasm32-unknown-emscripten --interpreter "${PYTHON_VERSION}" --out dist
      - name: Check for SIMD instructions
        run: |
          unzip -q -d unpacked dist/*.whl
          wasm_dis="$(pyodide config get emsdk_dir)/upstream/bin/wasm-dis"
          "${wasm_dis}" -all unpacked/pydustmasker/*.so > unpacked/module.wat
          # Match instructions such as "(f64x2.add", not names or v128 type declarations
          simd_instructions=$(grep -cE '\((v128|i8x16|i16x8|i32x4|i64x2|f32x4|f64x2)\.[a-z]' unpacked/module.wat || true)
          f64x2_arith=$(grep -cE '\(f64x2\.(add|mul|max)' unpacked/module.wat || true)
          echo "SIMD instructions found: ${simd_instructions} (f64x2 arithmetic: ${f64x2_arith})"
          test "${f64x2_arith}" -gt 0 || { echo "::error::No f64x2 SIMD arithmetic found in the Pyodide wheel"; exit 1; }
      - name: Test with pytest
        run: |
          pyodide venv .venv-pyodide
          source .venv-pyodide/bin/activate
          python -m pip install "pip>=26.1.1"
          python -m pip install "pytest>=9.0"
          python -m pip install pydustmasker --no-index --no-deps --find-links dist
          cp -r tests "${RUNNER_TEMP}/tests"
          cd "${RUNNER_TEMP}"
          python -m pytest tests
      - name: Upload wheel
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide
          path: dist
